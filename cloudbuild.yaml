# Cloud Build: build image -> push to Artifact Registry -> deploy Cloud Run.
# Trigger with: gcloud builds submit --config cloudbuild.yaml
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/atlas:${_TAG}"
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/atlas:${_TAG}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - atlas
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/atlas:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --cpu=1
      - --memory=1Gi
      - --timeout=540
      - --set-env-vars=STORE_BACKEND=firestore,FIRESTORE_PROJECT=${PROJECT_ID},GEMINI_MODEL=${_GEMINI_MODEL}

substitutions:
  _REGION: us-central1
  _REPO: atlas
  _TAG: latest
  _GEMINI_MODEL: gemini-3.5-flash

options:
  logging: CLOUD_LOGGING_ONLY
